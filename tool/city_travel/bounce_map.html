<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bounce Storage Finder</title>
<!--
  tool/city_travel/bounce_map.html

  Luggage storage finder for the trip page: the city map with Bounce spots,
  "Use my location" (shown on the map only inside the city area), and the
  spots listed nearest first. Spots come from bounce/<city>.js.

  Location needs a secure page, so open it through a local server:
      python -m http.server 8770 --bind 127.0.0.1   (run in tool/city_travel)
      then http://127.0.0.1:8770/bounce_map.html
  Away from the city? Tap the map to try a location there.
-->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600;700&display=swap">
<style>
:root {
  --bg: #f8f5f3; --surface: #ffffff; --ink: #1e1715; --muted: #6f625e; --line: #ebe2de;
  --accent: #c42a1f; --accent-ink: #ffffff; --accent-soft: rgba(196, 42, 31, .08);
  --me: #1a73e8; --warn-bg: #fff4e0; --warn-ink: #7a4b00;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #141010; --surface: #1e1817; --ink: #f4ece9; --muted: #ab9e99; --line: #332a28;
  --accent: #ff6b5d; --accent-ink: #1e0d0b; --accent-soft: rgba(255, 107, 93, .12);
  --me: #6ea8ff; --warn-bg: #3a2a10; --warn-ink: #ffd27a; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); display: flex; flex-direction: column; }
header { padding: 14px max(16px, env(safe-area-inset-left, 0px)) 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
h1 { font: 800 22px/1.1 var(--font-display); margin: 0; flex: 1; min-width: 200px; }
button { font: 600 14px var(--font-body); border-radius: 999px; padding: 9px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
button.primary { background: var(--me); border-color: var(--me); color: #fff; }
button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.banner { margin: 0 max(16px, env(safe-area-inset-left, 0px)) 8px; padding: 8px 12px; border-radius: 10px; font-size: 13px; background: var(--warn-bg); color: var(--warn-ink); }
.banner[hidden] { display: none; }
.status { margin: 0 max(16px, env(safe-area-inset-left, 0px)) 8px; font-size: 13px; color: var(--muted); min-height: 1.2em; }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; border-top: 1px solid var(--line); }
#map { min-height: 320px; background: var(--line); }
.list { overflow: auto; border-left: 1px solid var(--line); background: var(--surface); }
.list ol { list-style: none; margin: 0; padding: 0; }
.spot { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
.spot:hover, .spot.is-active { background: var(--accent-soft); }
.rank { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 13px; }
.spot h2 { font-size: 15px; margin: 0; }
.meta { margin: 2px 0 6px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dist { font-weight: 700; color: var(--ink); }
.spot a { font-size: 13px; font-weight: 700; color: var(--accent); text-decoration: none; }
.empty { padding: 16px; color: var(--muted); }
.pin { background: var(--accent); color: var(--accent-ink); border: 2px solid var(--surface); border-radius: 50%; display: grid; place-items: center; font: 800 12px var(--font-body); box-shadow: 0 1px 4px rgba(0,0,0,.35); }
.me-dot { background: var(--me); border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 0 6px rgba(26,115,232,.25); }
@media (max-width: 760px) {
  main { grid-template-columns: 1fr; grid-template-rows: 55vh auto; }
  .list { border-left: none; border-top: 1px solid var(--line); overflow: visible; }
}
@media (prefers-reduced-motion: reduce) { .leaflet-fade-anim .leaflet-popup, .leaflet-zoom-anim .leaflet-zoom-animated { transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1 id="title">Luggage storage</h1>
  <button id="btnLocate" class="primary" aria-pressed="false" type="button">
    <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8m9 3h-2.07A7 7 0 0 0 13 5.07V3h-2v2.07A7 7 0 0 0 5.07 11H3v2h2.07A7 7 0 0 0 11 18.93V21h2v-2.07A7 7 0 0 0 18.93 13H21zm-9 6a5 5 0 1 1 0-10 5 5 0 0 1 0 10"/></svg>
    <span>Use my location</span>
  </button>
</header>
<p class="banner" id="sampleBanner" hidden>Sample data: these pins are placeholders, not real Bounce locations. Booking links go to Bounce's real city page.</p>
<p class="status" id="status" role="status" aria-live="polite"></p>
<main>
  <div id="map" role="region" aria-label="Map of storage spots"></div>
  <section class="list" aria-labelledby="listTitle">
    <h2 id="listTitle" class="sr" style="position:absolute;left:-9999px">Storage spots</h2>
    <ol id="spots"></ol>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="bounce/abu-dhabi.js"></script>
<script>
"use strict";
const data = window.BOUNCE_CITY;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

$("title").textContent = `Luggage storage in ${data.city}`;
$("sampleBanner").hidden = !data.sample;

const bounds = L.latLngBounds(data.bounds);
const map = L.map("map", { zoomControl: true }).fitBounds(bounds);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
}).addTo(map);

// Distances: straight line, then x1.25 for roads, like the trip page's taxi estimates.
const R = 6371;
function km(a, b) {
  const toRad = (d) => d * Math.PI / 180;
  const dLat = toRad(b[0] - a[0]), dLon = toRad(b[1] - a[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a[0])) * Math.cos(toRad(b[0])) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function describe(d) {
  const road = d * 1.25;
  const dist = d < 1 ? `${Math.round(d * 1000 / 10) * 10} m` : `${d.toFixed(1)} km`;
  const travel = road <= 1.5 ? `≈ ${Math.max(1, Math.round(road / 4.8 * 60))} min walk` : `≈ ${Math.round(road / 40 * 60) + 4} min by taxi`;
  return `${dist} · ${travel}`;
}

let me = null;          // [lat, lon] of the reference point
let meSource = null;    // "gps" | "tap"
let meLayer = null, accLayer = null, watchId = null;
const markers = new Map();
let active = null;

// Each spot links to its own store page when the data has one (`url`); Bounce's https store
// links open the Bounce app when it's installed (app links), the website otherwise.
// Without a store link we fall back to the city page. Our ref code is always added.
function spotUrl(s) {
  if (!s.url) return data.bookingUrl;
  try {
    const u = new URL(s.url);
    u.searchParams.set("ref", data.ref);
    u.searchParams.set("utm_source", "affiliates");
    u.searchParams.set("utm_medium", "link");
    return u.toString();
  } catch (_) { return data.bookingUrl; }
}

function pinIcon(label) {
  return L.divIcon({ className: "", html: `<div class="pin" style="width:28px;height:28px">${label}</div>`, iconSize: [28, 28], iconAnchor: [14, 14] });
}

function sorted() {
  const ref = me && bounds.contains(me) ? me : null;
  return data.spots
    .map((s) => ({ ...s, d: ref ? km(ref, [s.lat, s.lon]) : null }))
    .sort((a, b) => (a.d ?? 0) - (b.d ?? 0) || a.name.localeCompare(b.name));
}

function render() {
  const list = sorted();
  markers.forEach((m) => m.remove());
  markers.clear();
  list.forEach((s, i) => {
    const label = s.d == null ? "•" : i + 1;
    const m = L.marker([s.lat, s.lon], { icon: pinIcon(label), title: s.name, keyboard: true })
      .addTo(map)
      .bindPopup(`<b>${esc(s.name)}</b><br>${esc(s.area)} · ${esc(s.hours)}${s.d != null ? `<br>${esc(describe(s.d))}` : ""}<br><a href="${esc(spotUrl(s))}" target="_blank" rel="noopener sponsored">${s.url ? "Book this spot" : "Book on Bounce"}</a>`);
    m.on("click", () => highlight(s.id, false));
    markers.set(s.id, m);
  });
  $("spots").innerHTML = list.length ? list.map((s, i) => `
    <li class="spot${s.id === active ? " is-active" : ""}" data-id="${esc(s.id)}" tabindex="0">
      <span class="rank" aria-hidden="true">${s.d == null ? "•" : i + 1}</span>
      <div>
        <h2>${esc(s.name)}</h2>
        <p class="meta">${s.d != null ? `<span class="dist">${esc(describe(s.d))}</span> · ` : ""}${esc(s.area)} · ${esc(s.hours)}</p>
        <a href="${esc(spotUrl(s))}" target="_blank" rel="noopener sponsored">${s.url ? "Book this spot →" : "Book on Bounce →"}</a>
      </div>
    </li>`).join("") : `<li class="empty">No storage spots for this city yet.</li>`;
}

function highlight(id, pan = true) {
  active = id;
  document.querySelectorAll(".spot").forEach((el) => el.classList.toggle("is-active", el.dataset.id === id));
  const m = markers.get(id);
  if (m && pan) { map.panTo(m.getLatLng()); m.openPopup(); }
  const el = document.querySelector(`.spot[data-id="${CSS.escape(id)}"]`);
  if (el && !pan) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

$("spots").addEventListener("click", (e) => {
  if (e.target.closest("a")) return;
  const li = e.target.closest(".spot");
  if (li) highlight(li.dataset.id);
});
$("spots").addEventListener("keydown", (e) => {
  const li = e.target.closest(".spot");
  if (li && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); highlight(li.dataset.id); }
});

function setMe(latlng, accuracy, source) {
  me = latlng;
  meSource = source;
  meLayer?.remove(); accLayer?.remove(); meLayer = accLayer = null;
  if (bounds.contains(me)) {
    if (accuracy) accLayer = L.circle(me, { radius: accuracy, color: "#1a73e8", weight: 1, fillOpacity: .08 }).addTo(map);
    meLayer = L.marker(me, { icon: L.divIcon({ className: "", html: '<div class="me-dot" style="width:18px;height:18px"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }), title: "You", zIndexOffset: 1000 }).addTo(map);
    const nearest = sorted()[0];
    $("status").textContent = source === "gps"
      ? `Showing spots nearest to you. Closest: ${nearest.name}, ${describe(nearest.d)}.`
      : `Showing spots nearest to the point you tapped. Closest: ${nearest.name}, ${describe(nearest.d)}.`;
  } else {
    const away = km(me, data.center);
    $("status").textContent = `You're about ${Math.round(away).toLocaleString()} km from ${data.city}, outside the map, so the list isn't sorted by distance. Tap the map to try a spot in ${data.city}.`;
  }
  render();
}

function stopTracking() {
  if (watchId != null) navigator.geolocation.clearWatch(watchId);
  watchId = null;
  $("btnLocate").setAttribute("aria-pressed", "false");
  $("btnLocate").querySelector("span").textContent = "Use my location";
}

$("btnLocate").addEventListener("click", () => {
  if (watchId != null) {
    stopTracking();
    if (meSource === "gps") { me = null; meLayer?.remove(); accLayer?.remove(); $("status").textContent = "Location off."; render(); }
    return;
  }
  if (!("geolocation" in navigator) || !window.isSecureContext) {
    $("status").textContent = "Location isn't available on this page. Open it from localhost or https, or tap the map to set a point.";
    return;
  }
  $("status").textContent = "Finding your location…";
  $("btnLocate").setAttribute("aria-pressed", "true");
  $("btnLocate").querySelector("span").textContent = "Stop using my location";
  let first = true;
  watchId = navigator.geolocation.watchPosition(
    (pos) => {
      setMe([pos.coords.latitude, pos.coords.longitude], pos.coords.accuracy, "gps");
      if (first && bounds.contains(me)) map.setView(me, Math.max(map.getZoom(), 13));
      first = false;
    },
    (err) => {
      stopTracking();
      $("status").textContent = err.code === err.PERMISSION_DENIED
        ? "Location permission was declined. Allow it in the browser's site settings, or tap the map to set a point."
        : "Couldn't get your location. Try again, or tap the map to set a point.";
    },
    { enableHighAccuracy: true, maximumAge: 30000, timeout: 15000 },
  );
});

map.on("click", (e) => {
  if (watchId != null) stopTracking();
  setMe([e.latlng.lat, e.latlng.lng], null, "tap");
});

$("status").textContent = `${data.spots.length} spots. Turn on your location to sort them nearest first, or tap the map.`;
render();
</script>
</body>
</html>
