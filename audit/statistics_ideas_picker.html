<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>통계 후보 체크</title>
<style>
:root { --bg:#fff; --fg:#1d2129; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --card:#f8fafc; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#14171c; --fg:#e8eaed; --muted:#9aa3af; --line:#2a2f37; --accent:#6ea0ff; --card:#1b1f26; }
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
header { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding:12px 16px; }
h1 { font-size:18px; margin:0 0 8px; }
.row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.tab { border:1px solid var(--line); background:var(--card); color:var(--fg); padding:6px 12px; border-radius:8px; cursor:pointer; font:inherit; }
.tab[aria-selected="true"] { border-color:var(--accent); color:var(--accent); font-weight:600; }
input[type=search] { flex:1 1 200px; min-width:160px; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); font:inherit; }
button.act { border:1px solid var(--line); background:var(--card); color:var(--fg); padding:6px 12px; border-radius:8px; cursor:pointer; font:inherit; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
main { padding:8px 16px 80px; max-width:900px; margin:0 auto; }
h2 { font-size:15px; margin:20px 0 6px; color:var(--muted); }
label.item { display:flex; gap:10px; padding:9px 4px; border-bottom:1px solid var(--line); cursor:pointer; align-items:flex-start; }
label.item input { width:18px; height:18px; margin-top:3px; flex:none; accent-color:var(--accent); }
label.item.on { background:color-mix(in srgb, var(--accent) 10%, transparent); }
a { color:var(--accent); }
#count { color:var(--muted); font-size:13px; }
#note { color:var(--muted); font-size:13px; margin:8px 0 0; }
</style>
</head>
<body>
<header>
  <h1>통계 후보 체크 <span id="count"></span></h1>

    <input type="search" id="q" placeholder="항목 검색">
    <button class="act" id="clear">전체 해제</button>
    <button class="act" id="copy">선택 목록 복사</button>
    <button class="act primary" id="save">선택 목록 저장 (.txt)</button>
  </div>
  <p id="note">체크는 이 브라우저에 자동 저장됩니다. 다 고르신 뒤 "복사"를 눌러 채팅에 붙여 넣거나, "저장"으로 받은 파일을 알려 주세요.</p>
</header>

const KEY = "statistics_ideas_picker_v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { state = {}; }
let current = DATA[0].key;
const $ = (s) => document.querySelector(s);

function persist() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

function selected() {
  const out = [];
  DATA.forEach(t => t.groups.forEach(g => g.items.forEach(i => {
    if (state[i.id]) out.push({ tab: t.title, group: g.name, plain: i.plain, id: i.id });
  })));
  return out;
}

function updateCount() {
  const total = DATA.reduce((n, t) => n + t.count, 0);
  $("#count").textContent = `선택 ${selected().length} / 전체 ${total}`;
  document.querySelectorAll(".tab").forEach(b => {
    const t = DATA.find(x => x.key === b.dataset.key);
    const n = t.groups.reduce((a, g) => a + g.items.filter(i => state[i.id]).length, 0);
    b.textContent = `${t.title} (${n}/${t.count})`;
  });
}

function render() {
  const q = $("#q").value.trim().toLowerCase();
  const tab = DATA.find(t => t.key === current);
  const list = $("#list");
  list.innerHTML = "";
  tab.groups.forEach(g => {
    const items = g.items.filter(i => !q || i.plain.toLowerCase().includes(q));
    if (!items.length) return;
    if (g.name) { const h = document.createElement("h2"); h.textContent = g.name; list.appendChild(h); }
    items.forEach(i => {
      const l = document.createElement("label");
      l.className = "item" + (state[i.id] ? " on" : "");
      const c = document.createElement("input");
      c.type = "checkbox"; c.checked = !!state[i.id];
      c.addEventListener("change", () => {
        if (c.checked) state[i.id] = 1; else delete state[i.id];
        l.classList.toggle("on", c.checked);
        persist(); updateCount();
      });
      const s = document.createElement("span"); s.innerHTML = i.html;
      l.appendChild(c); l.appendChild(s); list.appendChild(l);
    });
  });
  updateCount();
}

function buildTabs() {
  const box = $("#tabs");
  DATA.forEach(t => {
    const b = document.createElement("button");
    b.className = "tab"; b.dataset.key = t.key; b.setAttribute("role", "tab");
    b.addEventListener("click", () => { current = t.key; syncTabs(); render(); });
    box.appendChild(b);
  });
  syncTabs();
}
function syncTabs() { document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.key === current)); }

function exportText() {
  const sel = selected();
  let last = "";
  const lines = [];
  sel.forEach(s => {
    const head = s.tab + (s.group ? " / " + s.group : "");
    if (head !== last) { lines.push("", "## " + head); last = head; }
    lines.push("- " + s.plain);
  });
  return `선택한 통계 후보 ${sel.length}개` + lines.join("\n");
}

$("#q").addEventListener("input", render);
$("#clear").addEventListener("click", () => { if (confirm("모든 체크를 해제할까요?")) { state = {}; persist(); render(); } });
$("#copy").addEventListener("click", async () => {
  const t = exportText();
  try { await navigator.clipboard.writeText(t); alert("복사했습니다. 채팅에 붙여 넣어 주세요."); }
  catch (e) { prompt("아래 내용을 복사하세요", t); }
});
$("#save").addEventListener("click", () => {
  const blob = new Blob([exportText()], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "selected_statistics.txt"; a.click();
});

buildTabs(); render();
</script>
